[package]
name = "game2048"
version = "0.1.0"
description = "A calm, offline 2048 desktop game"
authors = ["2048 contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "game2048_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomicwrites = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
